name = "888clinic"
main = "src/server.ts"
compatibility_date = "2026-08-30"

[env.production]
name = "888clinic-prod"
routes = [
  { pattern = "888clinic.co", zone_name = "888clinic.co" }
]

[alias]
tslib = "./node_modules/tslib/tslib.es6.mjs"

[build]
command = "bun install && bun run build"

[env.production.vars]
NODE_ENV = "production"

[env.production.secrets]
VITE_PAYMENTS_CLIENT_TOKEN = "your_stripe_token"

# wrangler.toml
name = 'clinic-888'
