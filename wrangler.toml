name = "888clinic"
main = ".output/server/index.mjs"
compatibility_flags = ["nodejs_compat"]
# Nitro copies these settings into a single-environment deployment config.
# Keep production settings at the top level; redirected configs reject [env.*].
routes = [
  { pattern = "888clinic.co/*", zone_name = "888clinic.co" },
  { pattern = "www.888clinic.co/*", zone_name = "888clinic.co" }
]

[assets]
directory = ".output/public"

[alias]
tslib = "./node_modules/tslib/tslib.es6.mjs"

[vars]
NODE_ENV = "production"
